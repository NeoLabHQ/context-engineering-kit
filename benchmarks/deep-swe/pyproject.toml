[project]
name = "deep-swe-benchmark"
version = "0.1.0"
description = "Deep-SWE benchmark harness -- runs DeepSWE tasks against claude-code/sadd via pier."
requires-python = ">=3.12"
dependencies = [
    # Pinned to the exact release `run.py`'s flags were verified against (see
    # README's "Prerequisites" section) -- not a floor, an exact pin, so a
    # newer pier release can't silently change flag behavior underneath us.
    #
    # 0.3.1 is a FLOOR-IN-SPIRIT, not a preference: the deep-swe task set
    # declares `schema_version = "1.3"`, and pier 0.3.0 (schema 1.2) has no
    # `[[verifier.collect]]` field on `VerifierConfig`. Pydantic's default
    # `extra="ignore"` therefore DROPPED the task's collect hook -- the very
    # command that writes `/logs/artifacts/model.patch` -- with no warning, so
    # every trial was graded against a pristine repo (f2p 0/N, p2p N/N) and
    # then reported INCOMPLETE/no_model_patch as if the agent had abandoned
    # the task. 0.3.0 also silently ignored the task's `network_mode`
    # declarations; 0.3.1 honors both. Never downgrade below 0.3.1.
    "datacurve-pier==0.3.1",
    # `schedule.py` parses schedule.yaml -- the source of truth for which
    # (task, model, skill) trials `--mode scheduled` runs. PyYAML was already
    # importable here, but only TRANSITIVELY, via datacurve-pier. That is a
    # dependency on someone else's dependency graph: pier dropping or
    # repinning PyYAML would break a core code path of ours for a reason with
    # nothing to do with us. Declared directly because we import it directly.
    #
    # Lower bound, not a pin (unlike pier above, whose exact pin is explained
    # there): we use only `yaml.safe_load` and `yaml.YAMLError`, an API stable
    # across the whole 6.x line, so there is nothing here for a patch release
    # to change underneath us.
    "pyyaml>=6.0",
]

[tool.uv]
# This directory is a flat collection of scripts (run.py/agent.py/collect.py/
# report.py), not an installable package -- there is no src/ layout and
# nothing here defines a Python package to build a wheel from. `package =
# false` tells uv to manage a dependency-only virtualenv instead of trying
# (and failing) to build this directory as a distribution.
package = false
